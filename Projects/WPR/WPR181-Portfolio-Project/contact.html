    <main class="contact-container">
      <section class="form-header">
        <h1>Book an Inquiry</h1>
        <p class="section-subtitle">
          Please complete the booking form below. Our creative team will review
          your requirements and reach out within 24 hours.
        </p>
      </section>

      <!-- Semantic Form Wrapper  -->
      <form action="#" method="POST" class="booking-form">
        <fieldset>
          <legend>Service Inquiry Details</legend>

          <div class="form-group">
            <label for="full-name">Full Name:</label>
            <input
              type="text"
              id="full-name"
              name="full-name"
              rows="6"
              required
              placeholder="John Doe"
            />
          </div>

          <div class="form-group">
            <label for="email">Email Address:</label>
            <input
              type="email"
              id="email"
              name="email"
              required
              placeholder="johndoe@email.com"
            />
        
          </div>
<div class="form-group">
  <label for="phone">Phone Number:</label>

  <input
    type="tel"
    id="phone"
    name="phone"
    placeholder="082 123 4567"
  />
</div>
          <div class="form-group">
            <label for="service-type">Select Service Type:</label>
            <select id="service-type" name="service-type" required>
              <option value="">-- Choose an option --</option>
              <option value="corporate">Corporate Head shots</option>
              <option value="event">Event Coverage</option>
              <option value="product">Product Photography</option>
               <option value="video">Product Videography</option>
            </select>
          </div>

          <div class="form-group">
            <label for="booking-date">Preferred Project Date:</label>
            <input type="date" id="booking-date" name="booking-date" required />
          </div>

          <div class="form-group">
            <label for="message">Project Description & Requirements:</label>
            <textarea
              id="message"
              name="message"
              required
              placeholder="Please describe your visual requirements (location, duration, delivery dates)..."
            ></textarea>
          </div>

          <!-- Submit Button component -->
          <button type="submit" class="btn btn-primary">Submit Inquiry</button>
        </fieldset>
      </form>
    </main>
